name: Copy WordPress site

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "WordPress address to copy from"
        required: false
        default: "https://southernhl.com"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/mirror.yml"

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Point southernhl.com at the WordPress server
        # After the domain moves to Vercel, this keeps the copy coming from WordPress, not from Vercel itself.
        run: |
          IP="${{ vars.WP_SERVER_IP || '149.28.254.156' }}"
          echo "$IP southernhl.com www.southernhl.com" | sudo tee -a /etc/hosts
      - name: Copy the site
        env:
          MIRROR_INSECURE: ${{ vars.MIRROR_INSECURE || '' }}
        run: |
          rm -rf site
          python3 tools/mirror.py "${{ github.event.inputs.origin || vars.WP_ORIGIN || 'https://southernhl.com' }}"
      - name: Commit the copy
        run: |
          git config user.name "site-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update static copy of southernhl.com"
          git push
